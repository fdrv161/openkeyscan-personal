# Сборка архива со скриптами REAPER и движком анализа под Windows на GitHub Actions.
# Запускается при каждом push, вручную (Actions → Run workflow) и по тегу vX.Y.Z.
# По тегу архив выкладывается в Releases, в остальных случаях — в Artifacts запуска.
name: Сборка под Windows

on:
  push:
    branches: [main, windows-personal]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужно только для выкладки релиза по тегу

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-win.lock.txt

      - name: Установка зависимостей
        run: python -m pip install -r requirements-win.lock.txt

      - name: Проверка синтаксиса скриптов REAPER (Lua)
        run: |
          python -m pip install lupa==2.8
          python tools/check_lua.py

      - name: Самопроверка движка (Python)
        run: python -W ignore -m okscan.selftest

      - name: Сборка PyInstaller
        run: pyinstaller --noconfirm --log-level WARN okscan.spec

      - name: Самопроверка собранной программы
        run: dist\OpenKeyScan\okscan-cli.exe --selftest

      - name: Версия
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Архив для REAPER
        shell: pwsh
        run: |
          # Папка OpenKeyScan целиком распаковывается в Scripts REAPER: скрипты, справка и движок в engine.
          $pkg = "dist\package\OpenKeyScan"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item reaper\*.lua, reaper\README.md $pkg
          Copy-Item -Recurse dist\OpenKeyScan "$pkg\engine"
          7z a -tzip -mx=7 "dist\OpenKeyScan-REAPER-${{ steps.ver.outputs.version }}.zip" ".\$pkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: OpenKeyScan-REAPER-${{ steps.ver.outputs.version }}
          path: dist/package/
          retention-days: 30

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/OpenKeyScan-REAPER-*.zip --title "$GITHUB_REF_NAME" --notes "Скрипты OpenKeyScan для REAPER под Windows x64: тональность и BPM выбранных элементов. Распакуйте архив в папку Scripts REAPER, подробности в README.md внутри."
