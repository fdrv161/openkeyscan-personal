# Builds the archive with the REAPER scripts and the analysis engine on GitHub Actions (Windows).
# Runs only on a vX.Y.Z tag and by hand (Actions, Run workflow): there is no build on
# every push, to save Actions minutes and artifact storage.
# On a tag the archive goes to Releases; on a manual run it stays in Artifacts for 7 days.
name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish a release on a tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-win.lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-win.lock.txt

      - name: Check REAPER scripts (Lua syntax and logic)
        run: |
          python -m pip install lupa==2.8
          python tools/check_lua.py
          python tools/test_lua.py

      - name: Engine self-test (Python)
        run: python -W ignore -m okscan.selftest

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --log-level WARN okscan.spec

      - name: Self-test of the built program
        run: dist\OpenKeyScan\okscan-cli.exe --selftest

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive for REAPER
        shell: pwsh
        run: |
          # The whole OpenKeyScan folder is unpacked into REAPER's Scripts: scripts, help and the engine folder.
          $pkg = "dist\package\OpenKeyScan"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item reaper\*.lua, reaper\*.md $pkg
          Copy-Item -Recurse dist\OpenKeyScan "$pkg\engine"
          7z a -tzip -mx=7 "dist\OpenKeyScan-REAPER-${{ steps.ver.outputs.version }}.zip" ".\$pkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: OpenKeyScan-REAPER-${{ steps.ver.outputs.version }}
          path: dist/package/
          retention-days: 7

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # A "|" block, not a one-liner: YAML would read a colon followed by a space in the text as a key.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OpenKeyScan-REAPER-*.zip --title "$GITHUB_REF_NAME" --notes "OpenKeyScan scripts for REAPER on Windows x64: key and BPM of selected items. Unpack the archive into the REAPER Scripts folder, see README.md inside for details."
